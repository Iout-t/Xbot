name: Android APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          mkdir -p "$ANDROID_HOME"

          SDKMANAGER_DIR="$ANDROID_HOME/cmdline-tools"
          SDKMANAGER_BIN="$SDKMANAGER_DIR/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER_BIN" ]; then
            mkdir -p "$SDKMANAGER_DIR"
            cd "$SDKMANAGER_DIR"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
            unzip -q cmdline-tools.zip
            rm -f cmdline-tools.zip

            if [ -d "$SDKMANAGER_DIR/cmdline-tools" ]; then
              mv "$SDKMANAGER_DIR/cmdline-tools" "$SDKMANAGER_DIR/latest"
            fi
          fi

          if [ ! -x "$SDKMANAGER_BIN" ]; then
            echo "Android SDK command-line tools are unavailable."
            exit 1
          fi

          # sdkmanager exits before `yes` does after consuming the final answer.
          # With pipefail enabled, that normal SIGPIPE from `yes` would fail CI.
          set +e
          yes | "$SDKMANAGER_BIN" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          if [ "$sdkmanager_status" -ne 0 ]; then
            echo "sdkmanager --licenses failed with status $sdkmanager_status."
            exit "$sdkmanager_status"
          fi

          "$SDKMANAGER_BIN" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
