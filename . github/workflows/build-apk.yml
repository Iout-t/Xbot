name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release
          - both
      upload_artifacts:
        description: 'Upload APKs as artifacts'
        required: true
        default: true
        type: boolean

env:
  # Gradle configuration
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true"
  # JDK version (matching your gradle.properties)
  JAVA_VERSION: "17"
  # Android SDK configuration
  ANDROID_SDK_VERSION: "34"
  ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
  ANDROID_NDK_VERSION: "26.1.10909125"
  # Cache keys
  GRADLE_CACHE_KEY: "gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties', '**/buildSrc/**/*.kt') }}"
  DEPS_CACHE_KEY: "deps-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}"

permissions:
  contents: read
  packages: write
  actions: read
  # Needed for releasing
  id-token: write

jobs:
  # =========================================================================
  # PRE-CHECKS & VALIDATION
  # =========================================================================
  pre-checks:
    name: Pre-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gradle_version: ${{ steps.gradle-version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for version detection

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Get Gradle version
        id: gradle-version
        run: |
          VERSION=$(./gradlew --version | head -1 | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Gradle version: $VERSION"

      - name: Check for required files
        run: |
          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done
          echo "✅ All required files present"

  # =========================================================================
  # LINT & STATIC ANALYSIS
  # =========================================================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    needs: pre-checks
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          cmdline-tools-version: "latest"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ env.DEPS_CACHE_KEY }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Ktlint (Kotlin style)
        run: ./gradlew ktlintCheck --no-daemon

      - name: Run Detekt (Static analysis)
        run: ./gradlew detekt --no-daemon
        continue-on-error: true  # Don't fail build on warnings

      - name: Run Android Lint
        run: ./gradlew lint --no-daemon

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            **/build/reports/lint-results*.html
            **/build/reports/detekt*.html
          retention-days: 7

  # =========================================================================
  # UNIT TESTS
  # =========================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: pre-checks
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ env.DEPS_CACHE_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew test --no-daemon --continue

      - name: Generate Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**/*.html
          retention-days: 7

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "**/build/test-results/**/*.xml"

  # =========================================================================
  # INSTRUMENTED TESTS (Requires Emulator)
  # =========================================================================
  instrumented-tests:
    name: Instrumented Tests
    runs-on: ubuntu-latest
    needs: pre-checks
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          emulator: true  # Start emulator

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ env.DEPS_CACHE_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Start Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: ./gradlew connectedAndroidTest --no-daemon

      - name: Upload Instrumented Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-results
          path: |
            **/build/outputs/androidTest-results/**/*.xml
            **/build/reports/androidTests/**/*.html
          retention-days: 7

  # =========================================================================
  # BUILD DEBUG APK
  # =========================================================================
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [pre-checks, lint, unit-tests]
    if: github.event.inputs.build_type != 'release' || github.event_name != 'workflow_dispatch'
    timeout-minutes: 20
    outputs:
      apk_path: ${{ steps.upload.outputs.apk_path }}
      apk_size: ${{ steps.upload.outputs.apk_size }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ env.DEPS_CACHE_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Extract Version Info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "1")
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        id: verify
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [[ ! -f "$APK_PATH" ]]; then
            echo "❌ Debug APK not found!"
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "✅ Debug APK found: $APK_PATH ($APK_SIZE)"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        id: verify
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [[ ! -f "$APK_PATH" ]]; then
            echo "❌ Debug APK not found!"
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "✅ Debug APK found: $APK_PATH ($APK_SIZE)"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        id: upload
        uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        with:
          name: app-debug-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: ${{ steps.verify.outputs.apk_path }}
          retention-days: 30
          compression-level: 6

      - name: APK Info
        run: |
          echo "## Debug APK Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${{ steps.verify.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Path**: ${{ steps.verify.outputs.apk_path }}" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # BUILD RELEASE APK / AAB
  # =========================================================================
  build-release:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest
    needs: [pre-checks, lint, unit-tests]
    if: github.event.inputs.build_type != 'debug' || github.event_name != 'workflow_dispatch'
    timeout-minutes: 25
    outputs:
      apk_path: ${{ steps.upload-apk.outputs.apk_path }}
      aab_path: ${{ steps.upload-aab.outputs.aab_path }}
      apk_size: ${{ steps.upload-apk.outputs.apk_size }}
      aab_size: ${{ steps.upload-aab.outputs.aab_size }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_VERSION }}
          build-tools-version: ${{ env.ANDROID_BUILD_TOOLS_VERSION }}
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ env.GRADLE_CACHE_KEY }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ env.DEPS_CACHE_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Extract Version Info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "1.0.0")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "1")
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        if: env.KEYSTORE_BASE64 != ''
        id: keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "keystore_path=release.keystore" >> $GITHUB_OUTPUT
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create keystore.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build Release APK & AAB
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=${{ steps.keystore.outputs.keystore_path }} \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Verify Release Artifacts
        id: verify
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          
          if [[ ! -f "$APK_PATH" ]]; then
            echo "❌ Release APK not found!"
            exit 1
          fi
          
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
          
          if [[ -f "$AAB_PATH" ]]; then
            AAB_SIZE=$(du -h "$AAB_PATH" | cut -f1)
            echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
            echo "aab_size=$AAB_SIZE" >> $GITHUB_OUTPUT
            echo "✅ Release AAB found: $AAB_PATH ($AAB_SIZE)"
          else
            echo "⚠️ Release AAB not found"
          fi
          echo "✅ Release APK found: $APK_PATH ($APK_SIZE)"

      - name: Upload Release APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.upload_artifacts != 'false' }}
        with:
          name: app-release-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: ${{ steps.verify.outputs.apk_path }}
          retention-days: 90
          compression-level: 6

      - name: Upload Release AAB
        id: upload-aab
        uses: actions/upload-artifact@v4
        if: ${{ github.event.inputs.upload_artifacts != 'false' && steps.verify.outputs.aab_path != '' }}
        with:
          name: app-release-aab-${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: ${{ steps.verify.outputs.aab_path }}
          retention-days: 90compression-level: 6

      - name: Verify APK Signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APK_PATH="${{ steps.verify.outputs.apk_path }}"
          echo "Verifying APK signature..."
          apksigner verify --verbose --print-certs "$APK_PATH"

      - name: APK Info
        run: |
          echo "## Release Artifacts Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.version_code }})" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size**: ${{ steps.verify.outputs.apk_size }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.verify.outputs.aab_size }}" != "" ]]; then
            echo "- **AAB Size**: ${{ steps.verify.outputs.aab_size }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Signed**: ${{ env.KEYSTORE_BASE64 != '' && 'Yes' || 'No (Debug signing)' }}" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # BUILD SUMMARY & RELEASE
  # =========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-debug, build-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-${{ needs.build-debug.outputs.version_name }}-${{ needs.build-debug.outputs.version_code }}
          path: artifacts/debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-${{ needs.build-release.outputs.version_name }}-${{ needs.build-release.outputs.version_code }}
          path: artifacts/release

      - name: Download Release AAB
        uses: actions/download-artifact@v4
        if: needs.build-release.outputs.aab_path != ''
        with:
          name: app-release-aab-${{ needs.build-release.outputs.version_name }}-${{ needs.build-release.outputs.version_code }}
          path: artifacts/release-aab

      - name: Prepare Release Assets
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p release-assets
          
          # Rename debug APK
          cp artifacts/debug/*.apk "release-assets/AutomationApp-${VERSION}-debug.apk"
          
          # Rename release APK
          cp artifacts/release/*.apk "release-assets/AutomationApp-${VERSION}-release.apk"
          
          # Copy AAB if exists
          if [[ -f artifacts/release-aab/*.aab ]]; then
            cp artifacts/release-aab/*.aab "release-assets/AutomationApp-${VERSION}-release.aab"
          fi
          
          # Generate checksums
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AutomationApp ${{ github.ref_name }}"
          body: |
            ## AutomationApp ${{ github.ref_name }}
            
            ### Changes
            See [CHANGELOG.md](CHANGELOG.md) for details.
            
            ### Installation
            1. Download `AutomationApp-${{ github.ref_name }}-release.apk`
            2. Enable "Install from unknown sources" for your browser/file manager
            3. Install the APK
            4. Grant Accessibility permission: Settings → Accessibility → AutomationApp
            5. Grant MediaProjection permission when prompted
            
            ### Artifacts
            | File | Description |
            |------|-------------|
            | `AutomationApp-${{ github.ref_name }}-release.apk` | Signed release APK |
            | `AutomationApp-${{ github.ref_name }}-release.aab` | Android App Bundle (for Play Store) |
            | `AutomationApp-${{ github.ref_name }}-debug.apk` | Debug APK (for testing) |
            
            ### Verification
            SHA256 checksums are provided in `SHA256SUMS.txt`.
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================================
  # DEPENDENCY SECURITY SCAN
  # =========================================================================
  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    needs: pre-checks
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'AutomationApp'
          path: '.'
          format: 'HTML'
          out: 'reports/dependency-check'
          args: >
            --failOnCVSS 7
            --suppression suppression.xml
            --enableRetired
            --enableExperimental

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/dependency-check/
          retention-days: 30
# =========================================================================
  # FINAL STATUS
  # =========================================================================
  status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: [pre-checks, lint, unit-tests, instrumented-tests, build-debug, build-release, security-scan]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check Job Statuses
        run: |
          FAILED=0
          for job in pre-checks lint unit-tests instrumented-tests build-debug build-release security-scan; do
            STATUS="${{ needs.$job.result }}"
            if [[ "$STATUS" == "failure" || "$STATUS" == "cancelled" ]]; then
              echo "❌ $job: $STATUS"
              FAILED=1
            elif [[ "$STATUS" == "success" ]]; then
              echo "✅ $job: $STATUS"
            else
              echo "⏭️ $job: $STATUS (skipped)"
            fi
          done
          
          if [[ $FAILED -eq 1 ]]; then
            echo "## ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "## ✅ All Checks Passed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Summary
        run: |
          echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
